<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Parking Assistant{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-main">
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-glass sticky-top py-2 border-bottom border-subtle">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span class="brand-icon">
                    <i class="fa-solid fa-square-parking text-primary fs-3"></i>
                </span>
                <span class="brand-text">
                    <span class="fw-bold tracking-tight">SmartPark</span>
                    <span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle rounded-pill ms-1 text-xs">AI Assistant</span>
                </span>
            </a>

            <div class="d-flex align-items-center gap-3">
                {% if user %}
                    <div class="d-flex align-items-center gap-2 bg-card-pill px-3 py-1.5 rounded-pill border border-subtle">
                        <span class="role-badge badge {% if user.role == 'assistant' %}bg-warning text-dark{% else %}bg-info text-dark{% endif %} text-uppercase fw-semibold">
                            <i class="fa-solid {% if user.role == 'assistant' %}fa-id-badge{% else %}fa-car{% endif %} me-1"></i>
                            {{ user.role }}
                        </span>
                        <span class="small fw-semibold text-light text-truncate" style="max-width: 180px;">{{ user.full_name }}</span>
                    </div>

                    {% if user.role == 'assistant' %}
                        <a href="/assistant" class="btn btn-sm btn-outline-light d-none d-md-inline-flex align-items-center gap-1">
                            <i class="fa-solid fa-gauge-high"></i> Dashboard
                        </a>
                    {% else %}
                        <a href="/driver" class="btn btn-sm btn-outline-light d-none d-md-inline-flex align-items-center gap-1">
                            <i class="fa-solid fa-compass"></i> My Parking
                        </a>
                    {% endif %}

                    <a href="/logout" class="btn btn-sm btn-danger-soft text-danger d-inline-flex align-items-center gap-1">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="d-none d-sm-inline">Logout</span>
                    </a>
                {% else %}
                    <a href="/login" class="btn btn-sm btn-primary rounded-pill px-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notifications Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="appToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
                    <!-- Dynamic message -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Common JS -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
